<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>CYRA CTF 2026 // Closing Ceremony · Grand Escape</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Compiled CyRA Theme & Outro Stylesheet -->
  <link rel="stylesheet" href="assets/css/main.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #060813;
      user-select: none;
    }

    /* Outro HUD Polish & Controls */
    .cyra-outro-hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex !important;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(12, 13, 28, 0.82);
      border: 1px solid rgba(255, 195, 120, 0.25);
      border-radius: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 100;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .cyra-hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .cyra-hud-btn:hover {
      background: rgba(255, 96, 128, 0.2);
      border-color: #ff6080;
      color: #fff;
      transform: scale(1.08);
    }

    .cyra-hud-btn.text-link {
      width: auto;
      border-radius: 18px;
      padding: 0 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      gap: 6px;
    }

    .cyra-hud-counter {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      padding: 0 10px;
      letter-spacing: 0.08em;
    }

    /* Top Quick Exit Pill */
    .cyra-quick-exit {
      position: fixed;
      top: 18px;
      right: 24px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(15, 17, 34, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      color: #94a3b8;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem;
      text-decoration: none;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .cyra-quick-exit:hover {
      color: #f8fafc;
      border-color: #ff6080;
      background: rgba(255, 96, 128, 0.15);
    }

    /* Subtle help pill */
    .cyra-nav-hint {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 90;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      color: #64748b;
      background: rgba(10, 11, 24, 0.6);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="cyra-outro-viewport" class="cyra-outro-viewport" data-bg-state="bloom">
  <div class="cyra-cinematic-bar-top"></div>
  <div class="cyra-cinematic-bar-bottom"></div>

  <div class="cyra-outro-hud-left">
    CYRA<span>_</span>CTF // CLOSING CEREMONY
  </div>

  <div class="cyra-outro-watermark">
    <span>●</span> CYRA BROADCAST // 天気の子 · GRAND ESCAPE
  </div>

  <!-- Quick exit to Scoreboard -->
  <a href="index.html" class="cyra-quick-exit" title="Return to Scoreboard">
    <i class="fa-solid fa-arrow-left"></i>
    <span>SCOREBOARD</span>
  </a>

  <div class="cyra-outro-bg"></div>
  <div class="cyra-night-scrim"></div>
  <div class="cyra-outro-rays"></div>
  <div class="cyra-outro-scanlines"></div>

  <!-- Falling Sakura Petals Particle Layer -->
  <canvas id="cyra-sakura-canvas" class="cyra-sakura-canvas" style="z-index: 5; opacity: 0.75;"></canvas>

  <!-- Katana Slash Wipe Effect Layer -->
  <div id="cyra-katana-slash" class="cyra-katana-slash"></div>

  <!-- Main Animated Video Stage -->
  <div id="cyra-outro-slides-container" class="cyra-outro-stage">
    <!-- Smoothly animated and sequenced by cyra_outro.js -->
  </div>

  <!-- Floating Bottom HUD Navigation Controls -->
  <div class="cyra-outro-hud" id="cyra-outro-hud">
    <button type="button" class="cyra-hud-btn" id="btn-hud-prev" title="Previous Slide (← / PageUp)">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button type="button" class="cyra-hud-btn" id="btn-hud-play" title="Auto Play / Pause (Space / K)">
      <i class="fa-solid fa-play" id="btn-hud-play-icon"></i>
    </button>
    <button type="button" class="cyra-hud-btn" id="btn-hud-next" title="Next Slide (→ / Enter / PageDown)">
      <i class="fa-solid fa-chevron-right"></i>
    </button>
    <div class="cyra-hud-counter" id="cyra-hud-counter">1 / --</div>
    <button type="button" class="cyra-hud-btn" id="btn-hud-sound" title="Toggle Sound (M)">
      <i class="fa-solid fa-volume-high" id="btn-hud-sound-icon"></i>
    </button>
    <button type="button" class="cyra-hud-btn" id="btn-hud-fullscreen" title="Toggle Fullscreen (F)">
      <i class="fa-solid fa-expand"></i>
    </button>
    <a href="index.html" class="cyra-hud-btn text-link" title="Exit Presentation (ESC)">
      <i class="fa-solid fa-trophy"></i>
      <span>Scores</span>
    </a>
  </div>

  <div class="cyra-nav-hint">
    [Space] Play/Pause &nbsp;|&nbsp; [← / →] Slides &nbsp;|&nbsp; [M] Audio &nbsp;|&nbsp; [F] Fullscreen
  </div>
</div>

<!-- Embedded Telemetry Data Bundle (Immediate Offline & file:// Protocol Support) -->
<script src="data/data-bundle.js"></script>

<!-- Sakura Particle Physics Engine -->
<script src="assets/js/cyra-petals.js"></script>

<!-- Outro Closing Ceremony Presentation Sequencer -->
<script src="assets/js/cyra_outro.js"></script>

</body>
</html>
